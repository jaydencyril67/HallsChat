<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#19070b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest?v=6" />
    <link rel="icon" type="image/svg+xml" href="/crown-chat.svg?v=12" />
    <link rel="apple-touch-icon" href="/crown-chat.svg?v=12" />
    <meta name="description" content="HallsChat is a thoughtful space for everyday messages, your people, and closer connections." />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Resolve the saved appearance before the refresh splash paints. Dark mode
         remains the default and keeps its existing splash styling unchanged. */
      (() => {
        try {
          const choice = localStorage.getItem("hallschat-theme") || "dark";
          const light = choice === "light" ||
            (choice === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) {
            document.documentElement.dataset.theme = "light";
            document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#f8f3f1");
          }
        } catch {
          /* Keep the original dark splash if the saved preference is unavailable. */
        }
      })();
    </script>
    <style>
      /* Match CryBots global touch, text-selection and scrollbar rules. */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html, body, #root, * {
        scrollbar-width: none !important;
        scrollbar-color: transparent transparent !important;
        -ms-overflow-style: none !important;
      }

      html::-webkit-scrollbar, body::-webkit-scrollbar, #root::-webkit-scrollbar, *::-webkit-scrollbar,
      html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb, #root::-webkit-scrollbar-thumb, *::-webkit-scrollbar-thumb,
      html::-webkit-scrollbar-track, body::-webkit-scrollbar-track, #root::-webkit-scrollbar-track, *::-webkit-scrollbar-track,
      html::-webkit-scrollbar-corner, body::-webkit-scrollbar-corner, #root::-webkit-scrollbar-corner, *::-webkit-scrollbar-corner {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        min-width: 0 !important;
        min-height: 0 !important;
        border: 0 !important;
        background: transparent !important;
        color: transparent !important;
      }

      /* Keep text entry and selection working inside editable fields only. */
      input, textarea, select, [contenteditable="true"], [contenteditable=""] {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        user-select: text;
      }

      /* Early-paint splash tokens: defined here because the splash appears before React/CSS modules load. */
      :root {
        --splash-background: #19070b;
        --splash-foreground: #fff8f7;
      }
      html[data-theme="light"] {
        --splash-background: #f8f3f1;
        --splash-foreground: #32151d;
      }

      /* HallsChat refresh splash, shown before React mounts. */
      .initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        width: 100vw;
        height: 100dvh;
        min-height: 100vh;
        overflow: hidden;
        background: var(--splash-background);
        color: var(--splash-foreground);
      }
      .initial-splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }
      .initial-splash-logo-circle {
        display: grid;
        place-items: center;
        width: 92px;
        height: 92px;
        flex: 0 0 92px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 248, 247, 0.12);
        border-radius: 50%;
        background: #000;
        box-shadow: none;
      }
      .initial-splash-logo {
        display: block;
        width: 72px;
        height: 72px;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        object-position: center;
      }
      .initial-splash-title {
        margin: 0;
        color: inherit;
        font: inherit;
        font-size: 13px;
        line-height: 1.4;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .initial-splash-powered {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom) + 28px);
        z-index: 10001;
        display: block;
        margin: 0;
        padding: 0 16px;
        box-sizing: border-box;
        color: inherit;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: 0.08em;
        opacity: 0.72;
        text-align: center;
        pointer-events: none;
      }
.initial-splash-shimmer {
        position: relative;
        contain: paint;
        width: 180px;
        height: 3px;
        margin-top: -8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        isolation: isolate;
      }
      .initial-splash-shimmer::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #fff, transparent);
        transform: translate3d(-130%, 0, 0);
        backface-visibility: hidden;
        will-change: transform;
        animation: initial-splash-shimmer 1.15s linear infinite !important;
        animation-play-state: running !important;
      }
      @keyframes initial-splash-shimmer {
        0% { transform: translate3d(-100%, 0, 0); }
        100% { transform: translate3d(240%, 0, 0); }
      }
    </style>
    <script>
      /* Prevent the mobile long-press context menu outside editable fields, as in CryBots. */
      document.addEventListener("contextmenu", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        if (target.closest('input, textarea, select, [contenteditable="true"], [contenteditable=""]')) return;
        event.preventDefault();
      });
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HallsChat — Closer conversations. Stronger connections." />
    <meta property="og:description" content="Make room for the conversations that make life matter." />
    <meta name="twitter:card" content="summary" />
    <title>HallsChat — Closer conversations. Stronger connections.</title>
  </head>
  <body>
    <div id="initial-splash" class="initial-splash" aria-label="Loading HallsChat">
      <div class="initial-splash-card">
        <div class="initial-splash-logo-circle"><img class="initial-splash-logo" src="/splash-logo.svg?v=2" alt="HallsChat" /></div>
        <p class="initial-splash-title">HallsChat</p>
        <div class="initial-splash-shimmer" aria-hidden="true"></div>
      </div>
      <p class="initial-splash-powered">Powered by KingsHall</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
