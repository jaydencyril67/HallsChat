                  block = opening + block[len(block[:block.find(">") + 1]):]
              deep_link = '''
                      <intent-filter android:autoVerify="false">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="hallschat" android:host="call" />
                      </intent-filter>
              '''
              block = block.replace("</activity>", deep_link + "\n</activity>", 1)
              text = text[:match.start()] + block + text[match.end():]

          path.write_text(text)
          print("Configured native incoming-call screen, full-screen notification actions, and hallschat://call deep links")
