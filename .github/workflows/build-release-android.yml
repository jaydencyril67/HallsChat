                      <path android:pathData="M61,113h71" android:fillColor="#00000000" android:strokeColor="#74213F" android:strokeWidth="6" android:strokeLineCap="round" />
                      <path android:pathData="M57,75a5,5 0 1,1 -10,0a5,5 0 1,1 10,0 M92,61a5,5 0 1,1 -10,0a5,5 0 1,1 10,0 M129,61a5,5 0 1,1 -10,0a5,5 0 1,1 10,0 M146,75a5,5 0 1,1 -10,0a5,5 0 1,1 10,0" android:fillColor="#74213F" />
