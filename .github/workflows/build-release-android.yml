                  text = text.replace("</manifest>", f'    <uses-permission android:name="{permission}" />\n</manifest>', 1)

          if "NativeIncomingCallMessagingService" not in text:
              declarations = '''
                  <service android:name="com.capacitorjs.plugins.pushnotifications.MessagingService" tools:node="remove" />
                  <service android:name=".NativeIncomingCallMessagingService" android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
