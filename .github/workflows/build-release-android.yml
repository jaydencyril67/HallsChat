name: Build Production Android APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build the HallsChat production APK'
        required: true
        default: false
        type: boolean
      app_version:
        description: 'HallsChat Android version (use the same version for the GitHub Release tag, without the v)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: hallschat-release-apk
  cancel-in-progress: true

jobs:
  build-release:
    if: inputs.build_apk == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout HallsChat
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install web dependencies
        run: npm install

      - name: Install pinned Android build dependencies
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@7.6.9 \
            @capacitor/android@7.6.9 \
            @capacitor/cli@7.6.9 \
            @capacitor/assets@3.0.5 \
            @capacitor/splash-screen@7.0.3 \
            sharp

      - name: Verify HallsChat web build
        run: npm run build

      - name: Create Capacitor Android project
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.kingshall.hallschat',
            appName: 'HallsChat',
            webDir: 'dist',
            server: { androidScheme: 'https' }
          };

          export default config;
          EOF
          npx cap add android

      - name: Set HallsChat Android version
        env:
          APP_VERSION: ${{ inputs.app_version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["APP_VERSION"].strip()
          version_code = os.environ["APP_VERSION_CODE"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("APP_VERSION must use semantic version format such as 1.0.0")

          path = Path("android/app/build.gradle")
          text = path.read_text()
          text, code_count = re.subn(r"(?m)^\s*versionCode\s+\d+\s*$", f"        versionCode {version_code}", text, count=1)
          text, name_count = re.subn(r"""(?m)^\s*versionName\s+["'][^"']*["']\s*$""", f'versionName "{version}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode and versionName")
          path.write_text(text)
          print(f"Configured HallsChat version {version} (versionCode {version_code})")
          PY

      - name: Prepare release signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing

          run_id="$(gh run list \
            --workflow generate-release-keystore.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful HallsChat signing-key workflow was found."
            echo "Run 'Generate HallsChat Release Signing Key' once before building the production APK."
            exit 1
          fi

          gh run download "$run_id" \
            --name hallschat-release-signing-files \
            --dir signing

          test -f signing/hallschat-release.keystore
          test -f signing/hallschat-signing-credentials.txt
          cp signing/hallschat-release.keystore android/app/hallschat-release.keystore

          set -a
          source signing/hallschat-signing-credentials.txt
          set +a

          test -n "${HALLSCHAT_ANDROID_KEYSTORE_PASSWORD:-}"
          test -n "${HALLSCHAT_ANDROID_KEY_ALIAS:-}"
          test -n "${HALLSCHAT_ANDROID_KEY_PASSWORD:-}"

          cat >> android/gradle.properties <<EOF
          HALLSCHAT_KEYSTORE_FILE=hallschat-release.keystore
          HALLSCHAT_KEYSTORE_PASSWORD=$HALLSCHAT_ANDROID_KEYSTORE_PASSWORD
          HALLSCHAT_KEY_ALIAS=$HALLSCHAT_ANDROID_KEY_ALIAS
          HALLSCHAT_KEY_PASSWORD=$HALLSCHAT_ANDROID_KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "signingConfigs {" not in text:
              signing_block = """    signingConfigs {
              release {
                  storeFile file(project.findProperty("HALLSCHAT_KEYSTORE_FILE"))
                  storePassword project.findProperty("HALLSCHAT_KEYSTORE_PASSWORD")
                  keyAlias project.findProperty("HALLSCHAT_KEY_ALIAS")
                  keyPassword project.findProperty("HALLSCHAT_KEY_PASSWORD")
              }
          }

          """
              marker = "    buildTypes {"
              if marker not in text:
                  raise SystemExit("Could not find Android buildTypes block")
              text = text.replace(marker, signing_block + marker, 1)

          build_types = re.search(r"(?ms)^    buildTypes {.*$", text)
          if not build_types:
              raise SystemExit("Could not find Android buildTypes block")

          build_text = build_types.group(0)
          release_match = re.search(r"(?m)^        release {\n", build_text)
          if not release_match:
              raise SystemExit("Could not find Android release build type")

          release_start = release_match.end()
          release_body_end = build_text.find("\n        }", release_start)
          if release_body_end == -1:
              raise SystemExit("Could not find end of release build type")

          release_body = build_text[release_start:release_body_end]
          if "signingConfig signingConfigs.release" not in release_body:
              build_text = build_text[:release_start] + "            signingConfig signingConfigs.release\n" + build_text[release_start:]

          text = text[:build_types.start()] + build_text
          path.write_text(text)
          PY

      - name: Build signed HallsChat production APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --console=plain assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          cp "$APK" HallsChat.apk
          test -s HallsChat.apk
          sha256sum HallsChat.apk > HallsChat.apk.sha256
          ls -lh HallsChat.apk

      - name: Upload HallsChat production APK
        uses: actions/upload-artifact@v4
        with:
          name: hallschat-release-apk
          path: |
            HallsChat.apk
            HallsChat.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish HallsChat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Choose a new app_version so every APK has a unique release tag."
            exit 1
          fi

          gh release create "$tag" HallsChat.apk HallsChat.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "HallsChat $APP_VERSION" \
            --notes "HallsChat Android release $APP_VERSION.

          Download HallsChat.apk and install it on Android. Android may ask you to confirm installation."
