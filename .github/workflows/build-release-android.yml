          if "NativeIncomingCallMessagingService" not in text:
              declarations = '''
                  <service android:name="com.capacitorjs.plugins.pushnotifications.MessagingService" tools:node="remove" />
                  <service android:name=".NativeIncomingCallMessagingService" android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
                  <activity android:name=".IncomingCallActivity" android:exported="false" android:excludeFromRecents="true" android:launchMode="singleTop" android:showWhenLocked="true" android:turnScreenOn="true" android:theme="@android:style/Theme.Material.NoActionBar" />
              '''
              text = text.replace("</application>", declarations + "\n</application>", 1)

          if 'android:scheme="hallschat"' not in text:
              match = re.search(r'<activity\b(?=[^>]*android:name="\.MainActivity")[\s\S]*?</activity>', text)
              if not match:
                  raise SystemExit("Could not locate MainActivity in AndroidManifest.xml")
              block = match.group(0)
              opening = block[:block.find(">") + 1]
              if 'android:launchMode=' not in opening:
                  opening = opening[:-1] + ' android:launchMode="singleTask">'
                  block = opening + block[len(block[:block.find(">") + 1]):]
