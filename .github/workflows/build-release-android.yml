          cat > android/app/src/main/res/drawable/hallschat_splash_icon.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="432dp"
              android:height="432dp"
              android:viewportWidth="432"
              android:viewportHeight="432">
              <group android:translateX="104" android:translateY="104" android:scaleX="1.1666667" android:scaleY="1.1666667">
                  <path android:pathData="M43,0 H149 A43,43 0 0 1 192,43 V149 A43,43 0 0 1 149,192 H43 A43,43 0 0 1 0,149 V43 A43,43 0 0 1 43,0 Z">
                      <aapt:attr name="android:fillColor">
