name: Build Production Android APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build the HallsChat production APK'
        required: true
        default: false
        type: boolean
      app_version:
        description: 'HallsChat Android version (use the same version for the GitHub Release tag, without the v)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: hallschat-release-apk
  cancel-in-progress: true

jobs:
  build-release:
    if: inputs.build_apk == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout HallsChat
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install web dependencies
        run: npm install

      - name: Install pinned Android build dependencies
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@7.6.9 \
            @capacitor/android@7.6.9 \
            @capacitor/cli@7.6.9 \
            @capacitor/assets@3.0.5 \
            @capacitor/splash-screen@7.0.3 \
            sharp

      - name: Verify HallsChat web build
        run: npm run build

      - name: Create Capacitor Android project
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.kingshall.hallschat',
            appName: 'HallsChat',
            webDir: 'dist',
            server: { androidScheme: 'https' }
          };

          export default config;
          EOF
          npx cap add android

      - name: Generate HallsChat native app icons
        run: |
          set -euo pipefail
          mkdir -p assets
          cp public/crown-chat.svg assets/icon.svg
          cp public/crown-chat.svg assets/splash.svg
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure unified HallsChat native launch splash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values-v31

          # Keep the launch mark circular on both legacy and Android 12+ splash APIs.
          cat > android/app/src/main/res/drawable/hallschat_splash_icon.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="432dp"
              android:height="432dp"
              android:viewportWidth="192"
              android:viewportHeight="192">
              <path
                  android:fillColor="#210812"
                  android:pathData="M96,8 A88,88 0,1 0,96,184 A88,88 0,1 0,96,8" />
              <path
                  android:fillColor="#000000"
                  android:fillAlpha="0"
                  android:strokeColor="#74213F"
                  android:strokeWidth="2"
                  android:pathData="M96,9 A87,87 0,1 0,96,183 A87,87 0,1 0,96,9" />
              <path
                  android:fillColor="#FFF8F2"
                  android:pathData="M58,48 H134 C142,48 148,54 148,62 V100 C148,108 142,114 134,114 H99 L77,131 L81,114 H58 C50,114 44,108 44,100 V62 C44,54 50,48 58,48 Z" />
              <path
                  android:fillColor="#74213F"
                  android:pathData="M59,75 L72,86 L87,64 L102,86 L117,64 L130,75 L123,99 H66 Z" />
              <path
                  android:fillColor="#74213F"
                  android:pathData="M68,105 H121 V110 H68 Z" />
              <path
                  android:fillColor="#74213F"
                  android:pathData="M55,75 A4,4 0,1 0,63,75 A4,4 0,1 0,55,75 M83,64 A4,4 0,1 0,91,64 A4,4 0,1 0,83,64 M113,64 A4,4 0,1 0,121,64 A4,4 0,1 0,113,64 M126,75 A4,4 0,1 0,134,75 A4,4 0,1 0,126,75" />
          </vector>
          XML

          cat > /tmp/hallschat_branding.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
            <rect width="800" height="320" fill="none"/>
            <text x="400" y="174"
                  text-anchor="middle"
                  fill="#FFF8F2"
                  font-family="sans-serif"
                  font-size="86"
                  font-weight="700">HallsChat</text>
          </svg>
          SVG
          node - <<'NODE'
          const sharp = require('sharp');
          sharp('/tmp/hallschat_branding.svg')
            .png()
            .toFile('android/app/src/main/res/drawable/hallschat_branding.png')
            .then(() => console.log('Created HallsChat branding PNG'))
            .catch((err) => { console.error(err); process.exit(1); });
          NODE

          # Android 11 and below use this full launch layer-list. Android 12+ uses
          # the same burgundy surface and circular crown-chat mark through SplashScreen.
          cat > android/app/src/main/res/drawable/hallschat_launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/hallschat_splash_background" />
              <item
                  android:width="213dp"
                  android:height="213dp"
                  android:gravity="center"
                  android:drawable="@drawable/hallschat_splash_icon" />
              <item
                  android:width="160dp"
                  android:height="64dp"
                  android:gravity="center|bottom"
                  android:bottom="51dp"
                  android:drawable="@drawable/hallschat_branding" />
          </layer-list>
          XML

          cat > android/app/src/main/res/values/hallschat_splash_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="hallschat_splash_background">#54152D</color>
          </resources>
          XML

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/res/values/styles.xml")
          text = path.read_text()
          pattern = re.compile(
              r'(?s)<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>'
          )
          replacement = """<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="android:windowBackground">@drawable/hallschat_launch_background</item>
              <item name="windowSplashScreenBackground">@color/hallschat_splash_background</item>
              <item name="windowSplashScreenAnimatedIcon">@drawable/hallschat_splash_icon</item>
              <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
          </style>"""
          if not pattern.search(text):
              raise SystemExit("Could not find Capacitor AppTheme.NoActionBarLaunch")
          path.write_text(pattern.sub(replacement, text, count=1))
          PY

          cat > android/app/src/main/res/values-v31/hallschat_splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:windowSplashScreenBackground">@color/hallschat_splash_background</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/hallschat_splash_icon</item>
                  <item name="android:windowSplashScreenBrandingImage">@drawable/hallschat_branding</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          XML

      - name: Set HallsChat Android version
        env:
          APP_VERSION: ${{ inputs.app_version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["APP_VERSION"].strip()
          version_code = os.environ["APP_VERSION_CODE"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("APP_VERSION must use semantic version format such as 1.0.0")

          path = Path("android/app/build.gradle")
          text = path.read_text()
          text, code_count = re.subn(r"(?m)^\s*versionCode\s+\d+\s*$", f"        versionCode {version_code}", text, count=1)
          text, name_count = re.subn(r"""(?m)^\s*versionName\s+["'][^"']*["']\s*$""", f'versionName "{version}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode and versionName")
          path.write_text(text)
          print(f"Configured HallsChat version {version} (versionCode {version_code})")
          PY

      - name: Prepare release signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing

          run_id="$(gh run list \
            --workflow generate-release-keystore.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful HallsChat signing-key workflow was found."
            echo "Run 'Generate HallsChat Release Signing Key' once before building the production APK."
            exit 1
          fi

          gh run download "$run_id" \
            --name hallschat-release-signing-files \
            --dir signing

          test -f signing/hallschat-release.keystore
          test -f signing/hallschat-signing-credentials.txt
          cp signing/hallschat-release.keystore android/app/hallschat-release.keystore

          set -a
          source signing/hallschat-signing-credentials.txt
          set +a

          test -n "${HALLSCHAT_ANDROID_KEYSTORE_PASSWORD:-}"
          test -n "${HALLSCHAT_ANDROID_KEY_ALIAS:-}"
          test -n "${HALLSCHAT_ANDROID_KEY_PASSWORD:-}"

          cat >> android/gradle.properties <<EOF
          HALLSCHAT_KEYSTORE_FILE=hallschat-release.keystore
          HALLSCHAT_KEYSTORE_PASSWORD=$HALLSCHAT_ANDROID_KEYSTORE_PASSWORD
          HALLSCHAT_KEY_ALIAS=$HALLSCHAT_ANDROID_KEY_ALIAS
          HALLSCHAT_KEY_PASSWORD=$HALLSCHAT_ANDROID_KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "signingConfigs {" not in text:
              signing_block = """    signingConfigs {
              release {
                  storeFile file(project.findProperty("HALLSCHAT_KEYSTORE_FILE"))
                  storePassword project.findProperty("HALLSCHAT_KEYSTORE_PASSWORD")
                  keyAlias project.findProperty("HALLSCHAT_KEY_ALIAS")
                  keyPassword project.findProperty("HALLSCHAT_KEY_PASSWORD")
              }
          }

          """
              marker = "    buildTypes {"
              if marker not in text:
                  raise SystemExit("Could not find Android buildTypes block")
              text = text.replace(marker, signing_block + marker, 1)

          build_types = re.search(r"(?ms)^    buildTypes {.*$", text)
          if not build_types:
              raise SystemExit("Could not find Android buildTypes block")

          build_text = build_types.group(0)
          release_match = re.search(r"(?m)^        release {\n", build_text)
          if not release_match:
              raise SystemExit("Could not find Android release build type")

          release_start = release_match.end()
          release_body_end = build_text.find("\n        }", release_start)
          if release_body_end == -1:
              raise SystemExit("Could not find end of release build type")

          release_body = build_text[release_start:release_body_end]
          if "signingConfig signingConfigs.release" not in release_body:
              build_text = build_text[:release_start] + "            signingConfig signingConfigs.release\n" + build_text[release_start:]

          text = text[:build_types.start()] + build_text
          path.write_text(text)
          PY

      - name: Build signed HallsChat production APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --console=plain assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" HallsChat.apk
          test -s HallsChat.apk
          sha256sum HallsChat.apk > HallsChat.apk.sha256
          ls -lh HallsChat.apk

      - name: Upload HallsChat production APK
        uses: actions/upload-artifact@v4
        with:
          name: hallschat-release-apk
          path: |
            HallsChat.apk
            HallsChat.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish HallsChat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Choose a new app_version so every APK has a unique release tag."
            exit 1
          fi

          gh release create "$tag" HallsChat.apk HallsChat.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "HallsChat $APP_VERSION" \
            --notes "HallsChat Android release $APP_VERSION.

          Download HallsChat.apk and install it on Android. Android may ask you to confirm installation."
