          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class IncomingCallActivity extends Activity {
              private String callId = "";
              private String callerName = "HallsChat user";
              private String kind = "audio";

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  String action = intent.getStringExtra("callAction");
                  if ("answer".equals(action) || "decline".equals(action)) openApp(action);
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                      | WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                      | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                      | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD);

                  Intent intent = getIntent();
                  callId = value(intent.getStringExtra("callId"), "");
                  callerName = value(intent.getStringExtra("callerName"), "HallsChat user");
                  kind = "video".equals(intent.getStringExtra("kind")) ? "video" : "audio";
                  String action = intent.getStringExtra("callAction");
                  if ("answer".equals(action) || "decline".equals(action)) {
                      openApp(action);
                      return;
                  }
                  renderCallScreen();
              }

              private String value(String value, String fallback) {
                  return value == null || value.trim().isEmpty() ? fallback : value;
              }

              private void renderCallScreen() {
                  getWindow().getDecorView().setSystemUiVisibility(0);
                  getWindow().setStatusBarColor(Color.rgb(25, 7, 11));
                  getWindow().setNavigationBarColor(Color.rgb(25, 7, 11));
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(32, 48, 32, 48);
                  root.setBackgroundColor(Color.rgb(25, 7, 11));

                  TextView brand = new TextView(this);
                  brand.setText("HallsChat");
                  brand.setTextColor(Color.rgb(239, 193, 207));
                  brand.setTextSize(15);
                  brand.setLetterSpacing(0.12f);
                  brand.setGravity(Gravity.CENTER);
                  root.addView(brand, new LinearLayout.LayoutParams(-1, -2));

                  TextView avatar = new TextView(this);
                  avatar.setText(callerName.isEmpty() ? "H" : callerName.substring(0, 1).toUpperCase());
                  avatar.setTextColor(Color.rgb(255, 248, 242));
                  avatar.setTextSize(38);
                  avatar.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  avatar.setGravity(Gravity.CENTER);
                  avatar.setBackgroundColor(Color.rgb(84, 21, 45));
                  LinearLayout.LayoutParams avatarParams = new LinearLayout.LayoutParams(112, 112);
                  avatarParams.gravity = Gravity.CENTER;
                  avatarParams.topMargin = 64;
                  avatarParams.bottomMargin = 28;
                  root.addView(avatar, avatarParams);

                  TextView name = new TextView(this);
                  name.setText(callerName);
                  name.setTextColor(Color.rgb(255, 248, 242));
                  name.setTextSize(26);
                  name.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  name.setGravity(Gravity.CENTER);
                  root.addView(name, new LinearLayout.LayoutParams(-1, -2));

                  TextView label = new TextView(this);
                  label.setText("Incoming " + kind + " call");
                  label.setTextColor(Color.rgb(239, 193, 207));
                  label.setTextSize(16);
                  label.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams labelParams = new LinearLayout.LayoutParams(-1, -2);
                  labelParams.topMargin = 12;
                  labelParams.bottomMargin = 72;
                  root.addView(label, labelParams);

                  Button answer = new Button(this);
                  answer.setText("Answer");
                  answer.setTextColor(Color.WHITE);
                  answer.setBackgroundTintList(android.content.res.ColorStateList.valueOf(Color.rgb(35, 135, 85)));
                  root.addView(answer, buttonParams());
                  answer.setOnClickListener(v -> openApp("answer"));

                  Button decline = new Button(this);
                  decline.setText("Decline");
                  decline.setTextColor(Color.WHITE);
                  decline.setBackgroundTintList(android.content.res.ColorStateList.valueOf(Color.rgb(160, 43, 67)));
                  LinearLayout.LayoutParams declineParams = buttonParams();
                  declineParams.topMargin = 16;
                  root.addView(decline, declineParams);
                  decline.setOnClickListener(v -> openApp("decline"));

                  setContentView(root);
              }

              private LinearLayout.LayoutParams buttonParams() {
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(-1, 58);
                  params.gravity = Gravity.CENTER;
                  return params;
              }

              private void openApp(String action) {
                  if (callId.isEmpty()) {
                      finish();
                      return;
                  }
                  NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (manager != null) manager.cancel(callId.hashCode());
                  Uri uri = new Uri.Builder().scheme("hallschat").authority("call")
                      .appendQueryParameter("action", action)
                      .appendQueryParameter("callId", callId)
                      .appendQueryParameter("callerName", callerName)
                      .appendQueryParameter("kind", kind)
                      .build();
                  Intent launch = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  if (launch == null) {
                      finish();
                      return;
                  }
                  launch.setAction(Intent.ACTION_VIEW);
                  launch.setData(uri);
                  launch.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(launch);
                  finish();
              }
          }
