name: Build Signed HallsChat Release APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build the signed HallsChat production APK
        required: true
        default: false
        type: boolean
      app_version:
        description: Android version name (for example 1.0.0)
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: hallschat-release-apk
  cancel-in-progress: true

jobs:
  build-release:
    if: inputs.build_apk == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out HallsChat
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install web dependencies
        run: npm install

      - name: Install pinned Capacitor Android dependencies
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@7.6.9 \
            @capacitor/android@7.6.9 \
            @capacitor/cli@7.6.9

      - name: Create bundled Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.kingshall.hallschat',
            appName: 'HallsChat',
            webDir: 'dist',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

      - name: Build HallsChat web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Set Android version
        env:
          APP_VERSION: ${{ inputs.app_version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          version = os.environ["APP_VERSION"].strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("APP_VERSION must look like 1.0.0")
          path = Path("android/app/build.gradle")
          text = path.read_text()
          text, code_count = re.subn(r"(?m)^\s*versionCode\s+\d+\s*$", f"        versionCode {os.environ['APP_VERSION_CODE']}", text, count=1)
          text, name_count = re.subn(r"""(?m)^\s*versionName\s+["'][^"']*["']\s*$""", f'        versionName "{version}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Unable to set Android versionCode/versionName safely")
          path.write_text(text)
          print(f"Building HallsChat {version} (code {os.environ['APP_VERSION_CODE']})")
          PY

      - name: Verify signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.HALLSCHAT_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HALLSCHAT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALLSCHAT_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALLSCHAT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for ${name}. Configure HALLSCHAT_ANDROID_KEYSTORE_BASE64, HALLSCHAT_ANDROID_KEYSTORE_PASSWORD, HALLSCHAT_ANDROID_KEY_ALIAS, and HALLSCHAT_ANDROID_KEY_PASSWORD."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hallschat-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/hallschat-release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "HALLSCHAT_KEYSTORE_PATH=$RUNNER_TEMP/hallschat-release.keystore" >> "$GITHUB_ENV"

      - name: Configure Gradle signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.HALLSCHAT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALLSCHAT_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALLSCHAT_ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv('HALLSCHAT_KEYSTORE_PATH'))
                      storePassword System.getenv('HALLSCHAT_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('HALLSCHAT_KEY_ALIAS')
                      keyPassword System.getenv('HALLSCHAT_KEY_PASSWORD')
                  }
              }
          """
          if "signingConfigs {" not in s:
              marker = "android {"
              if marker not in s: raise SystemExit("Android Gradle android block not found")
              s = s.replace(marker, marker + signing, 1)
          release_marker = "buildTypes {"
          if release_marker not in s: raise SystemExit("Android Gradle buildTypes block not found")
          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(release_marker, release_marker + """
                  release {
                      signingConfig signingConfigs.release
                  }
              """, 1)
          p.write_text(s)
          PY
          {
            echo "HALLSCHAT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "HALLSCHAT_KEY_ALIAS=$KEY_ALIAS"
            echo "HALLSCHAT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Sync bundled web assets
        run: npx cap sync android

      - name: Build signed release APK
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          mkdir -p release
          cp "$APK" "release/HallsChat-${{ inputs.app_version }}-release.apk"
          sha256sum "release/HallsChat-${{ inputs.app_version }}-release.apk" > "release/HallsChat-${{ inputs.app_version }}-release.apk.sha256"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: hallschat-release-apk
          path: release/*
          retention-days: 7
