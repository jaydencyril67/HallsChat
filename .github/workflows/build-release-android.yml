          package com.kingshall.hallschat;

          import android.app.ActivityManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Build;
          import android.media.AudioAttributes;
          import android.net.Uri;
          import com.capacitorjs.plugins.pushnotifications.MessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;
          import java.util.List;

          public class NativeIncomingCallMessagingService extends MessagingService {
              private static final String CHANNEL_ID = "hallschat_incoming_calls";

              private boolean isAppVisible() {
                  ActivityManager manager = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                  if (manager == null) return false;
                  List<ActivityManager.RunningAppProcessInfo> processes = manager.getRunningAppProcesses();
                  if (processes == null) return false;
                  for (ActivityManager.RunningAppProcessInfo process : processes) {
                      if (getPackageName().equals(process.processName)
                          && process.importance <= ActivityManager.RunningAppProcessInfo.IMPORTANCE_VISIBLE) return true;
                  }
                  return false;
              }

              @Override
              public void onMessageReceived(RemoteMessage message) {
                  Map<String, String> data = message.getData();
                  if (!"incoming-call".equals(data.get("type")) || isAppVisible()) {
                      super.onMessageReceived(message);
                      return;
                  }

                  String callId = data.get("callId");
                  if (callId == null || callId.trim().isEmpty()) return;
                  String caller = data.get("callerName");
                  if (caller == null || caller.trim().isEmpty()) caller = "HallsChat user";
                  String kind = "video".equals(data.get("kind")) ? "video" : "audio";
                  String title = data.get("title");
                  if (title == null || title.trim().isEmpty()) title = "Incoming " + kind + " call";
                  String body = data.get("body");
                  if (body == null || body.trim().isEmpty()) body = caller + " is calling you on HallsChat.";

                  Context context = getApplicationContext();
                  NotificationManager manager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (manager == null) return;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Incoming calls", NotificationManager.IMPORTANCE_HIGH);
                      channel.setDescription("Incoming HallsChat audio and video calls");
                      channel.enableVibration(true);
                      channel.setVibrationPattern(new long[] {0, 350, 180, 350, 180, 700});
                      channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      channel.setBypassDnd(false);
                      manager.createNotificationChannel(channel);
                  }

                  int notificationId = callId.hashCode();
                  Intent screenIntent = new Intent(context, IncomingCallActivity.class);
                  screenIntent.putExtra("callId", callId);
                  screenIntent.putExtra("callerName", caller);
                  screenIntent.putExtra("kind", kind);
                  screenIntent.setAction("hallschat.call.screen." + callId);
                  PendingIntent fullScreen = PendingIntent.getActivity(context, notificationId,
                      screenIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Intent answerIntent = new Intent(context, IncomingCallActivity.class);
                  answerIntent.putExtras(screenIntent);
                  answerIntent.putExtra("callAction", "answer");
                  answerIntent.setAction("hallschat.call.answer." + callId);
                  PendingIntent answer = PendingIntent.getActivity(context, notificationId + 1,
                      answerIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Intent declineIntent = new Intent(context, IncomingCallActivity.class);
                  declineIntent.putExtras(screenIntent);
                  declineIntent.putExtra("callAction", "decline");
                  declineIntent.setAction("hallschat.call.decline." + callId);
                  PendingIntent decline = PendingIntent.getActivity(context, notificationId + 2,
                      declineIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(context, CHANNEL_ID)
                      : new Notification.Builder(context);
                  builder.setSmallIcon(android.R.drawable.sym_call_incoming)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setCategory(Notification.CATEGORY_CALL)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setPriority(Notification.PRIORITY_MAX)
                      .setAutoCancel(false)
                      .setOngoing(true)
                      .setTimeoutAfter(60000)
                      .setVibrate(new long[] {0, 350, 180, 350, 180, 700})
                      .setContentIntent(fullScreen)
                      .setFullScreenIntent(fullScreen, true)
                      .addAction(new Notification.Action.Builder(android.R.drawable.sym_action_call, "Answer", answer).build())
                      .addAction(new Notification.Action.Builder(android.R.drawable.ic_menu_close_clear_cancel, "Decline", decline).build());
                  manager.notify(notificationId, builder.build());
              }
          }
