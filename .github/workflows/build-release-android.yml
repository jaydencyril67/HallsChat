name: Build Production Android APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build the HallsChat production APK'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: hallschat-release-apk
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout HallsChat
        uses: actions/checkout@v4

      - name: Calculate next HallsChat release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName,isDraft,isPrerelease > releases.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          releases = json.loads(Path("releases.json").read_text())
          versions = []
          for release in releases:
              if release.get("isDraft") or release.get("isPrerelease"):
                  continue
              tag = release.get("tagName", "")
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if not versions:
              next_version = (1, 0, 0)
          else:
              major, minor, patch = max(versions)
              if patch < 9:
                  patch += 1
              else:
                  patch = 0
                  if minor < 9:
                      minor += 1
                  else:
                      minor = 0
                      major += 1
              next_version = (major, minor, patch)

          version = ".".join(map(str, next_version))
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"app_version={version}\n")
          print(f"Next HallsChat release version: {version}")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install web dependencies
        run: npm install

      - name: Install pinned Android build dependencies
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@7.6.9 \
            @capacitor/android@7.6.9 \
            @capacitor/cli@7.6.9 \
            @capacitor/assets@3.0.5 \
            @capacitor/splash-screen@7.0.3 \
            @capacitor/push-notifications@7.0.2 \
            sharp

      - name: Verify HallsChat web build
        run: npm run build

      - name: Create Capacitor Android project
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.kingshall.hallschat',
            appName: 'HallsChat',
            webDir: 'dist',
            server: { androidScheme: 'https' }
          };

          export default config;
          EOF
          npx cap add android

      - name: Generate HallsChat native app icons
        run: |
          set -euo pipefail
          mkdir -p assets
          cp public/crown-chat-app-icon.svg assets/icon.svg
          cp public/crown-chat-app-icon.svg assets/splash.svg
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Match HallsChat APK launcher icons to the PWA master icon
        env:
          APP_ICON_SVG: public/crown-chat-app-icon.svg
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          (async () => {
            const svgPath = process.env.APP_ICON_SVG;
            const svg = fs.readFileSync(svgPath);
            const densities = {
              'mipmap-mdpi': { icon: 48, foreground: 108 },
              'mipmap-hdpi': { icon: 72, foreground: 162 },
              'mipmap-xhdpi': { icon: 96, foreground: 216 },
              'mipmap-xxhdpi': { icon: 144, foreground: 324 },
              'mipmap-xxxhdpi': { icon: 192, foreground: 432 }
            };
            const root = 'android/app/src/main/res';
            for (const [folder, sizes] of Object.entries(densities)) {
              const dir = path.join(root, folder);
              if (!fs.existsSync(dir)) {
                throw new Error('Expected generated Android icon directory is missing: ' + dir);
              }
              for (const name of ['ic_launcher.png', 'ic_launcher_round.png']) {
                await sharp(svg).resize(sizes.icon, sizes.icon).png().toFile(path.join(dir, name));
              }
              await sharp(svg).resize(sizes.foreground, sizes.foreground).png()
                .toFile(path.join(dir, 'ic_launcher_foreground.png'));
            }
            for (const name of ['ic_launcher.xml', 'ic_launcher_round.xml']) {
              const xmlPath = path.join(root, 'mipmap-anydpi-v26', name);
              if (!fs.existsSync(xmlPath)) {
                throw new Error('Expected adaptive launcher resource is missing: ' + xmlPath);
              }
              const xml = fs.readFileSync(xmlPath, 'utf8');
              if (!xml.includes('@mipmap/ic_launcher_foreground')) {
                throw new Error(name + ' does not reference the foreground icon being updated.');
              }
            }
            console.log('Replaced APK launcher icon PNGs and adaptive foregrounds with the exact PWA master SVG composition; splash resources were not changed.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE


      - name: Configure Firebase for Android push
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("FIREBASE_GOOGLE_SERVICES_JSON", "").strip()
          encoded = os.environ.get("FIREBASE_GOOGLE_SERVICES_JSON_BASE64", "").strip()

          if raw:
              content = raw
              source = "raw JSON secret"
          elif encoded:
              try:
                  content = base64.b64decode(encoded, validate=True).decode("utf-8")
              except Exception as exc:
                  raise SystemExit(
                      "Firebase secret is not valid Base64. Add the raw JSON file content "
                      "as FIREBASE_GOOGLE_SERVICES_JSON, or fix the existing Base64 secret."
                  ) from exc
              source = "Base64 secret"
          else:
              raise SystemExit(
                  "Missing Firebase secret. Add FIREBASE_GOOGLE_SERVICES_JSON with the "
                  "contents of HallsChat's google-services.json."
              )

          try:
              data = json.loads(content)
          except Exception as exc:
              raise SystemExit("Firebase secret does not contain valid google-services.json JSON.") from exc

          packages = [
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in data.get("client", [])
          ]
          if "com.kingshall.hallschat" not in packages:
              raise SystemExit(
                  "Firebase config does not contain Android package com.kingshall.hallschat"
              )

          Path("android/app/google-services.json").write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Firebase Android configuration validated for com.kingshall.hallschat ({source})")
          PY
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/build.gradle')
          text = root.read_text()
          marker = 'dependencies {'
          if marker not in text:
              raise SystemExit('Could not find root Android buildscript dependencies block')
          start = text.find(marker)
          end = text.find('}', start)
          block = text[start:end]
          if 'com.google.gms:google-services' not in block:
              text = text[:end] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + text[end:]
          root.write_text(text)
          app = Path('android/app/build.gradle')
          text = app.read_text()
          if "apply plugin: 'com.google.gms.google-services'" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
          dep = "implementation platform('com.google.firebase:firebase-bom:33.7.0')"
          msg = "implementation 'com.google.firebase:firebase-messaging'"
          if dep not in text or msg not in text:
              marker = 'dependencies {'
              start = text.find(marker)
              if start < 0: raise SystemExit('Could not find app dependencies block')
              end = text.find('}', start)
              text = text[:end] + "\n    " + dep + "\n    " + msg + text[end:]
          app.write_text(text)
          print('Configured Google Services plugin and Firebase Messaging dependency')
          PY

      - name: Configure unified HallsChat native launch splash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi android/app/src/main/res/values android/app/src/main/res/values-v31

          # Generate the Android splash from the same complete master SVG used by
          # the PWA: identical 512px geometry, gradient circle diameter, and bubble artwork.
          # Remove only the outer square background; keep the circle and mark unchanged.
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');

          (async () => {
            let svg = fs.readFileSync('public/crown-chat-app-icon.svg', 'utf8');
            const opaqueBackground = '<rect width="512" height="512" fill="#19070B"/>';
            if (svg.includes(opaqueBackground)) {
              // Older master icon: remove only its square canvas.
              svg = svg.replace(opaqueBackground, '');
            } else if (svg.includes('<circle cx="256" cy="256" r="363" fill="url(#circle-bg)"/>')) {
              // Current master icon uses an oversized gradient circle instead of a square.
              // Scale the complete composition together so the APK splash keeps a true
              // circular silhouette with transparent corners, without changing artwork proportions.
              svg = svg.replace(
                '<circle cx="256" cy="256" r="363" fill="url(#circle-bg)"/>',
                '<circle cx="256" cy="256" r="235" fill="url(#circle-bg)"/>'
              ).replace(
                '<svg x="27.2" y="27.2" width="457.6" height="457.6" viewBox="0 0 192 192" overflow="hidden">',
                '<svg x="73" y="73" width="366" height="366" viewBox="0 0 192 192" overflow="hidden">'
              );
            } else {
              throw new Error('HallsChat master icon structure changed; cannot safely prepare the native splash.');
            }
            // The custom refresh splash uses a 92px circle and 72px logo.
            // Build distinct centered compositions for legacy Android (92dp canvas)
            // and Android 12+ (512px icon canvas rendered by the system).
            const rendered = await sharp(Buffer.from(svg)).png().toBuffer();
            await sharp(rendered).resize(545, 545).extract({ left: 16, top: 16, width: 512, height: 512 })
              .png().toFile('android/app/src/main/res/drawable-nodpi/hallschat_splash_logo.png');
            await sharp(rendered).resize(178, 178).png().toBuffer().then(async small => {
              await sharp({ create: { width: 512, height: 512, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
                .composite([{ input: small, left: 167, top: 167 }])
                .png().toFile('android/app/src/main/res/drawable-nodpi/hallschat_splash_logo_v31.png');
            });

            const branding = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320"><rect width="800" height="320" fill="none"/><text x="400" y="174" text-anchor="middle" fill="#FFF8F2" font-family="STIX Two Text, serif" font-size="72" font-weight="700" letter-spacing="3">HallsChat</text></svg>');
            await sharp(branding).png().toFile('android/app/src/main/res/drawable-nodpi/hallschat_branding.png');
            const audit = await sharp('android/app/src/main/res/drawable-nodpi/hallschat_splash_logo.png').ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            const alphaAt = (x, y) => audit.data[(y * audit.info.width + x) * audit.info.channels + 3];
            if (alphaAt(0, 0) !== 0 || alphaAt(256, 0) !== 0 || alphaAt(256, 256) === 0) {
              throw new Error('HallsChat splash image failed transparency/circle validation.');
            }
            console.log('Created and validated HallsChat splash directly from the shared 512px master icon composition.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

          cat > android/app/src/main/res/drawable/hallschat_launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/hallschat_splash_background" />
              <item
                  android:width="94dp"
                  android:height="94dp"
                  android:gravity="center"
                  android:drawable="@drawable/hallschat_splash_logo" />
              <item
                  android:width="160dp"
                  android:height="64dp"
                  android:gravity="center|bottom"
                  android:bottom="51dp"
                  android:drawable="@drawable/hallschat_branding" />
          </layer-list>
          XML

          cat > android/app/src/main/res/values/hallschat_splash_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="hallschat_splash_background">#19070B</color>
          </resources>
          XML

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/res/values/styles.xml")
          text = path.read_text()
          pattern = re.compile(r'(?s)<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>')
          replacement = """<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="android:windowBackground">@drawable/hallschat_launch_background</item>
              <item name="windowSplashScreenBackground">@color/hallschat_splash_background</item>
              <item name="windowSplashScreenAnimatedIcon">@drawable/hallschat_splash_logo</item>
              <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
          </style>"""
          if not pattern.search(text):
              raise SystemExit("Could not find Capacitor AppTheme.NoActionBarLaunch")
          path.write_text(pattern.sub(lambda _: replacement, text, count=1))
          PY

          cat > android/app/src/main/res/values-v31/hallschat_splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:windowSplashScreenBackground">@color/hallschat_splash_background</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/hallschat_splash_logo_v31</item>
                  <item name="android:windowSplashScreenBrandingImage">@drawable/hallschat_branding</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          XML
      - name: Set HallsChat Android version
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["APP_VERSION"].strip()
          version_code = os.environ["APP_VERSION_CODE"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("APP_VERSION must use semantic version format such as 1.0.0")

          path = Path("android/app/build.gradle")
          text = path.read_text()
          text, code_count = re.subn(r"(?m)^\s*versionCode\s+\d+\s*$", f"        versionCode {version_code}", text, count=1)
          text, name_count = re.subn(r"""(?m)^\s*versionName\s+["'][^"']*["']\s*$""", f'versionName "{version}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode and versionName")
          path.write_text(text)
          print(f"Configured HallsChat version {version} (versionCode {version_code})")
          PY

      - name: Add native APK update installer
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/kingshall/hallschat
          cat > android/app/src/main/java/com/kingshall/hallschat/NativeAppUpdatePlugin.java <<'JAVA'
          package com.kingshall.hallschat;
          
          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageInfo;
          import android.database.Cursor;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;
          
          import java.net.HttpURLConnection;
          import java.net.URL;
          
          @CapacitorPlugin(name = "NativeAppUpdate")
          public class NativeAppUpdatePlugin extends Plugin {
              private BroadcastReceiver downloadReceiver;
              private long pendingDownloadId = -1L;
              private String pendingDownloadUrl = "";
          
              private String statusLabel(int status) {
                  if (status == DownloadManager.STATUS_PENDING) return "PENDING";
                  if (status == DownloadManager.STATUS_RUNNING) return "RUNNING";
                  if (status == DownloadManager.STATUS_PAUSED) return "PAUSED";
                  if (status == DownloadManager.STATUS_SUCCESSFUL) return "SUCCESSFUL";
                  if (status == DownloadManager.STATUS_FAILED) return "FAILED";
                  return "UNKNOWN(" + status + ")";
              }
          
              private String reasonLabel(int reason) {
                  switch (reason) {
                      case DownloadManager.ERROR_CANNOT_RESUME: return "CANNOT_RESUME";
                      case DownloadManager.ERROR_DEVICE_NOT_FOUND: return "DEVICE_NOT_FOUND";
                      case DownloadManager.ERROR_FILE_ALREADY_EXISTS: return "FILE_ALREADY_EXISTS";
                      case DownloadManager.ERROR_FILE_ERROR: return "FILE_ERROR";
                      case DownloadManager.ERROR_HTTP_DATA_ERROR: return "HTTP_DATA_ERROR";
                      case DownloadManager.ERROR_INSUFFICIENT_SPACE: return "INSUFFICIENT_SPACE";
                      case DownloadManager.ERROR_TOO_MANY_REDIRECTS: return "TOO_MANY_REDIRECTS";
                      case DownloadManager.ERROR_UNHANDLED_HTTP_CODE: return "UNHANDLED_HTTP_CODE";
                      case DownloadManager.ERROR_UNKNOWN: return "UNKNOWN";
                      case DownloadManager.PAUSED_QUEUED_FOR_WIFI: return "PAUSED_QUEUED_FOR_WIFI";
                      case DownloadManager.PAUSED_WAITING_FOR_NETWORK: return "PAUSED_WAITING_FOR_NETWORK";
                      case DownloadManager.PAUSED_WAITING_TO_RETRY: return "PAUSED_WAITING_TO_RETRY";
                      default:
                          if (reason >= 400 && reason < 600) return "HTTP_" + reason;
                          return reason == 0 ? "NONE" : "REASON_" + reason;
                  }
              }
          
              private void emitLog(String stage, String message, JSObject details) {
                  JSObject event = details == null ? new JSObject() : details;
                  event.put("stage", stage);
                  event.put("message", message);
                  event.put("timestamp", System.currentTimeMillis());
                  notifyListeners("downloadLog", event);
              }
          
              private JSObject queryDownload(long id) {
                  JSObject result = new JSObject();
                  result.put("downloadId", id);
                  result.put("downloadUrl", pendingDownloadUrl);
                  result.put("checkedAt", System.currentTimeMillis());
                  if (id < 0) {
                      result.put("status", "NO_DOWNLOAD");
                      result.put("message", "No download has been queued in this app session.");
                      return result;
                  }
          
                  DownloadManager manager = (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                  if (manager == null) {
                      result.put("status", "DOWNLOAD_SERVICE_UNAVAILABLE");
                      return result;
                  }
          
                  Cursor cursor = null;
                  try {
                      cursor = manager.query(new DownloadManager.Query().setFilterById(id));
                      if (cursor == null || !cursor.moveToFirst()) {
                          result.put("status", "NOT_FOUND");
                          result.put("message", "Android DownloadManager has no record for this download ID.");
                          return result;
                      }
          
                      int statusIndex = cursor.getColumnIndex(DownloadManager.COLUMN_STATUS);
                      int reasonIndex = cursor.getColumnIndex(DownloadManager.COLUMN_REASON);
                      int bytesIndex = cursor.getColumnIndex(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR);
                      int totalIndex = cursor.getColumnIndex(DownloadManager.COLUMN_TOTAL_SIZE_BYTES);
                      int uriIndex = cursor.getColumnIndex(DownloadManager.COLUMN_URI);
                      int localUriIndex = cursor.getColumnIndex(DownloadManager.COLUMN_LOCAL_URI);
                      int lastModifiedIndex = cursor.getColumnIndex(DownloadManager.COLUMN_LAST_MODIFIED_TIMESTAMP);
                      int status = statusIndex >= 0 ? cursor.getInt(statusIndex) : -1;
                      int reason = reasonIndex >= 0 ? cursor.getInt(reasonIndex) : 0;
                      long bytes = bytesIndex >= 0 ? cursor.getLong(bytesIndex) : -1L;
                      long total = totalIndex >= 0 ? cursor.getLong(totalIndex) : -1L;
                      result.put("status", statusLabel(status));
                      result.put("statusCode", status);
                      result.put("reason", reasonLabel(reason));
                      result.put("reasonCode", reason);
                      result.put("bytesDownloaded", bytes);
                      result.put("totalBytes", total);
                      if (uriIndex >= 0) result.put("requestedUri", cursor.getString(uriIndex));
                      if (localUriIndex >= 0) result.put("localUri", cursor.getString(localUriIndex));
                      if (lastModifiedIndex >= 0) result.put("lastModified", cursor.getLong(lastModifiedIndex));
                  } catch (Exception error) {
                      result.put("queryError", error.getClass().getSimpleName() + ": " + String.valueOf(error.getMessage()));
                  } finally {
                      if (cursor != null) cursor.close();
                  }
                  return result;
              }
          
              @PluginMethod
              public void getAppInfo(PluginCall call) {
                  try {
                      PackageInfo info = getContext().getPackageManager().getPackageInfo(getContext().getPackageName(), 0);
                      JSObject result = new JSObject();
                      result.put("versionName", info.versionName == null ? "" : info.versionName);
                      result.put("versionCode", Build.VERSION.SDK_INT >= 28 ? (double) info.getLongVersionCode() : (double) info.versionCode);
                      call.resolve(result);
                  } catch (Exception error) {
                      call.reject("Unable to read the installed HallsChat version.", error);
                  }
              }
          
              @PluginMethod
              public void getDownloadDiagnostics(PluginCall call) {
                  JSObject result = queryDownload(pendingDownloadId);
                  ConnectivityManager connectivity = (ConnectivityManager) getContext().getSystemService(Context.CONNECTIVITY_SERVICE);
                  try {
                      NetworkInfo active = connectivity == null ? null : connectivity.getActiveNetworkInfo();
                      result.put("networkConnected", active != null && active.isConnected());
                      result.put("networkType", active == null ? "NONE" : active.getTypeName());
                  } catch (Exception error) {
                      result.put("networkCheckError", error.getClass().getSimpleName() + ": " + String.valueOf(error.getMessage()));
                  }
                  result.put("androidVersion", Build.VERSION.RELEASE);
                  result.put("androidSdkInt", Build.VERSION.SDK_INT);
                  call.resolve(result);
              }
          
              @PluginMethod
              public void probeDownloadEndpoint(PluginCall call) {
                  String urlText = call.getString("url");
                  Uri parsed = urlText == null ? null : Uri.parse(urlText);
                  if (parsed == null || !"https".equalsIgnoreCase(parsed.getScheme()) ||
                          parsed.getHost() == null ||
                          !"hallschat.kingshall.online".equalsIgnoreCase(parsed.getHost())) {
                      call.reject("The probe URL is not a trusted HallsChat download URL.");
                      return;
                  }
          
                  new Thread(() -> {
                      HttpURLConnection connection = null;
                      try {
                          connection = (HttpURLConnection) new URL(urlText).openConnection();
                          connection.setRequestMethod("GET");
                          connection.setConnectTimeout(15000);
                          connection.setReadTimeout(15000);
                          connection.setInstanceFollowRedirects(true);
                          connection.setRequestProperty("Range", "bytes=0-0");
                          connection.setRequestProperty("Accept", "application/vnd.android.package-archive");
                          connection.connect();
                          int code = connection.getResponseCode();
                          JSObject result = new JSObject();
                          result.put("httpStatus", code);
                          result.put("contentType", String.valueOf(connection.getContentType()));
                          result.put("contentLength", connection.getContentLengthLong());
                          result.put("contentDisposition", String.valueOf(connection.getHeaderField("Content-Disposition")));
                          result.put("finalUrl", String.valueOf(connection.getURL()));
                          result.put("acceptRanges", String.valueOf(connection.getHeaderField("Accept-Ranges")));
                          result.put("probeTimestamp", System.currentTimeMillis());
                          result.put("ok", code >= 200 && code < 300 &&
                                  connection.getContentType() != null &&
                                  connection.getContentType().toLowerCase().contains("application/vnd.android.package-archive"));
                          try {
                              if (code >= 400) {
                                  java.io.InputStream errorStream = connection.getErrorStream();
                                  if (errorStream != null) errorStream.close();
                              } else {
                                  java.io.InputStream input = connection.getInputStream();
                                  if (input != null) {
                                      byte[] sample = new byte[4];
                                      int count = input.read(sample);
                                      StringBuilder hex = new StringBuilder();
                                      for (int i = 0; i < count; i++) {
                                          if (i > 0) hex.append(' ');
                                          hex.append(String.format("%02X", sample[i] & 0xFF));
                                      }
                                      result.put("firstBytesHex", hex.toString());
                                      result.put("looksLikeApkZip", count >= 2 && sample[0] == 0x50 && sample[1] == 0x4B);
                                      input.close();
                                  } else {
                                      result.put("firstBytesHex", "");
                                      result.put("looksLikeApkZip", false);
                                  }
                              }
                          } catch (Exception sampleError) {
                              result.put("sampleReadError", sampleError.getClass().getSimpleName() + ": " + String.valueOf(sampleError.getMessage()));
                          }
                          call.resolve(result);
                      } catch (Exception error) {
                          JSObject result = new JSObject();
                          result.put("ok", false);
                          result.put("error", error.getClass().getSimpleName() + ": " + String.valueOf(error.getMessage()));
                          result.put("probeTimestamp", System.currentTimeMillis());
                          call.resolve(result);
                      } finally {
                          if (connection != null) connection.disconnect();
                      }
                  }, "HallsChat-Apk-Probe").start();
              }
          
              @PluginMethod
              public void downloadAndInstall(PluginCall call) {
                  String url = call.getString("url");
                  Uri parsed = url == null ? null : Uri.parse(url);
                  if (parsed == null || !"https".equalsIgnoreCase(parsed.getScheme()) ||
                          parsed.getHost() == null ||
                          !"hallschat.kingshall.online".equalsIgnoreCase(parsed.getHost())) {
                      call.reject("The update URL is not a trusted HallsChat download URL.");
                      return;
                  }
          
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                          !getContext().getPackageManager().canRequestPackageInstalls()) {
                      Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getContext().getPackageName()));
                      getActivity().startActivity(settings);
                      JSObject result = new JSObject();
                      result.put("requiresPermission", true);
                      call.resolve(result);
                      return;
                  }
          
                  DownloadManager manager = (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                  if (manager == null) {
                      call.reject("Android's download service is unavailable.");
                      return;
                  }
          
                  try {
                      if (downloadReceiver != null) {
                          try { getContext().unregisterReceiver(downloadReceiver); } catch (Exception ignored) {}
                          downloadReceiver = null;
                      }
          
                      pendingDownloadUrl = url;
                      emitLog("queued", "Preparing Android DownloadManager request.", null);
                      IntentFilter filter = new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE);
                      downloadReceiver = new BroadcastReceiver() {
                          @Override public void onReceive(Context context, Intent intent) {
                              long completedId = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L);
                              if (completedId != pendingDownloadId) return;
          
                              try { getContext().unregisterReceiver(this); } catch (Exception ignored) {}
                              downloadReceiver = null;
          
                              JSObject diagnostics = queryDownload(completedId);
                              String status = diagnostics.optString("status", "UNKNOWN");
                              String reason = diagnostics.optString("reason", "UNKNOWN");
                              if (!"SUCCESSFUL".equals(status)) {
                                  String message = "APK download failed: " + status + " / " + reason +
                                          " (HTTP/reason code " + diagnostics.optInt("reasonCode", 0) + ").";
                                  diagnostics.put("message", message);
                                  emitLog("failed", message, diagnostics);
                                  notifyListeners("downloadError", diagnostics);
                                  return;
                              }
          
                              emitLog("downloaded", "APK downloaded successfully; opening Android installer.", diagnostics);
                              Uri apkUri = manager.getUriForDownloadedFile(completedId);
                              if (apkUri == null) {
                                  JSObject failure = queryDownload(completedId);
                                  failure.put("message", "Android reported a successful download but returned no APK file URI.");
                                  emitLog("installer_error", failure.optString("message"), failure);
                                  notifyListeners("downloadError", failure);
                                  return;
                              }
          
                              Intent install = new Intent(Intent.ACTION_VIEW);
                              install.setDataAndType(apkUri, "application/vnd.android.package-archive");
                              install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              try {
                                  getActivity().startActivity(install);
                                  emitLog("installer_opened", "Android package installer opened.", diagnostics);
                              } catch (Exception error) {
                                  JSObject failure = queryDownload(completedId);
                                  failure.put("message", "Android could not launch the package installer: " + String.valueOf(error.getMessage()));
                                  emitLog("installer_error", failure.optString("message"), failure);
                                  notifyListeners("downloadError", failure);
                              }
                          }
                      };
          
                      if (Build.VERSION.SDK_INT >= 33) {
                          getContext().registerReceiver(downloadReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                      } else {
                          getContext().registerReceiver(downloadReceiver, filter);
                      }
          
                      DownloadManager.Request request = new DownloadManager.Request(parsed);
                      request.setTitle("HallsChat update");
                      request.setDescription("Downloading the latest HallsChat APK.");
                      request.setMimeType("application/vnd.android.package-archive");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setAllowedOverMetered(true);
                      request.setAllowedOverRoaming(false);
                      request.setDestinationInExternalFilesDir(getContext(), Environment.DIRECTORY_DOWNLOADS,
                              "HallsChat-update-" + System.currentTimeMillis() + ".apk");
                      pendingDownloadId = manager.enqueue(request);
          
                      JSObject result = new JSObject();
                      result.put("status", "downloading");
                      result.put("downloadId", (double) pendingDownloadId);
                      result.put("url", url);
                      result.put("queuedAt", System.currentTimeMillis());
                      emitLog("started", "Android DownloadManager accepted the request.", result);
                      call.resolve(result);
                  } catch (Exception error) {
                      if (downloadReceiver != null) {
                          try { getContext().unregisterReceiver(downloadReceiver); } catch (Exception ignored) {}
                          downloadReceiver = null;
                      }
                      JSObject failure = new JSObject();
                      failure.put("message", "Unable to start the APK download: " + String.valueOf(error.getMessage()));
                      failure.put("error", error.getClass().getSimpleName());
                      emitLog("start_error", failure.optString("message"), failure);
                      call.reject(failure.optString("message"), error);
                  }
              }
          
              @Override
              protected void handleOnDestroy() {
                  if (downloadReceiver != null) {
                      try { getContext().unregisterReceiver(downloadReceiver); } catch (Exception ignored) {}
                      downloadReceiver = null;
                  }
                  super.handleOnDestroy();
              }
          }
