name: Generate HallsChat Release Signing Key

on:
  workflow_dispatch:
    inputs:
      confirm_generation:
        description: 'Confirm you intentionally want to generate HallsChat permanent signing credentials'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate-keystore:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_generation == true
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate permanent signing credentials
        run: |
          set -euo pipefail
          # Use one simple generated password for both PKCS12 store and key.
          # This avoids mismatches caused by pre-existing repository secrets.
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$STORE_PASSWORD"

          keytool -genkeypair \
            -v \
            -keystore hallschat-release.keystore \
            -alias hallschat \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -storetype PKCS12 \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=HallsChat, OU=Mobile, O=KingsHall, L=Unknown, ST=Unknown, C=NG"

          # Verify the exact alias and passwords before preserving this key.
          keytool -list -v \
            -keystore hallschat-release.keystore \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -alias hallschat >/dev/null

          {
            echo "HALLSCHAT_ANDROID_KEY_ALIAS=hallschat"
            echo "HALLSCHAT_ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "HALLSCHAT_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } > hallschat-signing-credentials.txt
          chmod 600 hallschat-signing-credentials.txt hallschat-release.keystore

      - name: Upload keystore and credentials
        uses: actions/upload-artifact@v4
        with:
          name: hallschat-release-signing-files
          path: |
            hallschat-release.keystore
            hallschat-signing-credentials.txt
          retention-days: 90
