name: Generate HallsChat Release Signing Key

on:
  workflow_dispatch:
    inputs:
      confirm_generation:
        description: Confirm you want to create HallsChat's permanent Android signing key
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate-keystore:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_generation == true
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate permanent HallsChat signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore hallschat-release.keystore \
            -alias hallschat \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -storetype PKCS12 \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=HallsChat, OU=Mobile, O=KingsHall, L=Unknown, ST=Unknown, C=NG"
          KEYSTORE_BASE64="$(base64 -w 0 hallschat-release.keystore)"
          {
            echo "HALLSCHAT_ANDROID_KEYSTORE_BASE64=$KEYSTORE_BASE64"
            echo "HALLSCHAT_ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "HALLSCHAT_ANDROID_KEY_ALIAS=hallschat"
            echo "HALLSCHAT_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } > hallschat-signing-secrets.txt
          chmod 600 hallschat-signing-secrets.txt hallschat-release.keystore

      - name: Upload permanent signing files
        uses: actions/upload-artifact@v4
        with:
          name: hallschat-release-signing-files
          path: |
            hallschat-release.keystore
            hallschat-signing-secrets.txt
          retention-days: 7
